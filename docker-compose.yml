version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dropguard_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dropout_prediction_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dropout_prediction_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dropguard_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: dropguard_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dropout_prediction_db
      - SECRET_KEY=e83a453f651b1427c3e2dfb94c34a2e5d95e2f7b1e4a6d8c0b2d4e6f8a0b2c4d
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:8000
    volumes:
      - ./backend:/workspace
      - /workspace/app/models/__pycache__
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dropguard_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: dropguard_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    depends_on:
      - backend
    networks:
      - dropguard_net

volumes:
  postgres_data:

networks:
  dropguard_net:
    driver: bridge
