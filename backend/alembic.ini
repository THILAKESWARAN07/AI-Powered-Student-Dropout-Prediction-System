# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate new migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, required to find code inside app/
prepend_sys_path = .

# timezone to use when rendering dates within the migration file
# timezone =

# version table name
# version_locations = %(here)s/bar:%(here)s/bat

# logging configuration
# [loggers], [handlers], [formatters] etc. are defined at the end of the file

[post_write_hooks]
# post_write_hooks defines scripts or methods that are run after a revision is generated
# format = black

[logging]
default_level = INFO
